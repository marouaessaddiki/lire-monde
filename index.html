<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LireMonde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c97b4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      LireMonde
    </div>

    <ul class="nav-links">
      <li><a href="#" class="active">Accueil</a></li>
      <li><a href="#aLireSection">À lire</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>

    <input type="text" id="searchInput" placeholder="Rechercher un livre, auteur...">
  </nav>

  <!-- Genres -->
  <div class="filters" id="filters"></div>

  <!-- Section titre -->
  <div class="section-header">
    <h2>Bibliothèque</h2>
    <span class="section-line"></span>
    <span class="section-count" id="bookCount"></span>
  </div>

  <!-- Books -->
  <div class="books-container" id="booksContainer"></div>

  <!-- A Lire Section -->
  <div class="section-header" id="aLireSection">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c97b4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      À lire
    </h2>
    <span class="section-line"></span>
    <span class="section-count" id="aLireCount"></span>
  </div>
  <div class="alire-container" id="aLire"></div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">

      <div class="modal-top">
        <div class="modal-cover-wrap">
          <img id="modalImage" src="" alt="">
        </div>
        <div class="modal-meta">
          <h2 id="modalTitle"></h2>
          <p id="modalAuthor"></p>
          <span id="modalGenre" class="genre-badge"></span>
        </div>
        <button id="closeModal" class="close-btn" aria-label="Fermer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <p id="modalDescription"></p>
        <div class="modal-actions">
          <button id="toggleReadBtn"></button>
          <button id="closeModalBtn">Fermer</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 LireMonde — Plateforme de lecture numérique</p>
  </footer>

  <script src="accueil.js"></script>
</body>
</html>
